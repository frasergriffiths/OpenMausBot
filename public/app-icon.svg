      <rect width="1024" height="1024" fill="#0B0B0C" />
      <g transform="translate(-150 120) scale(7.2)">
        <path fill="url(#body)" d="M50 74C50 38 100 30 116 58C140 34 180 52 174 82C200 94 200 132 176 142C176 164 148 172 132 156C116 174 84 172 76 154C52 166 28 150 36 130C14 118 20 78 50 74Z"/>
      </g>
      <g fill="#101012">
