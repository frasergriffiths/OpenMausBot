<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">OpenMausBot</title>
  <desc id="desc">The cloud mascot, in white, tucked into the corner and looking up, on the black app tile.</desc>
  <defs>
    <clipPath id="tile"><rect width="1024" height="1024" rx="230.4" /></clipPath>
    <linearGradient id="body" x1="18%" y1="6%" x2="86%" y2="96%">
      <stop offset="0" stop-color="#FFFFFF" />
      <stop offset="0.55" stop-color="#F2F2F2" />
      <stop offset="1" stop-color="#D3D4D6" />
    </linearGradient>
  </defs>
  <g transform="translate(100 100) scale(0.8046875)">
